# https://github.com/actions/deploy-pages#usage
name: Deploy to GitHub Pages

on:
    workflow_dispatch:
    push:
        tags:
            - "*"

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v5
            - run: corepack enable
            - uses: actions/setup-node@v6
              with:
                  # Nuxt's build needs Set.prototype.difference, from Node 22
                  node-version: "24"

            - run: npx nypm install
            - name: Read the short commit hash
              id: git
              run: echo "short_sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
            - run: npm run build
              env:
                  NITRO_PRESET: github_pages
                  # Served at https://<owner>.github.io/<repository>/
                  NUXT_APP_BASE_URL: /${{ github.event.repository.name }}/
                  # Shown at the bottom of the user menu
                  NUXT_PUBLIC_GIT_TAG: ${{ github.ref_name }}
                  NUXT_PUBLIC_GIT_SHORT_SHA: ${{ steps.git.outputs.short_sha }}
                  # The Supabase project, from the repository's Actions secrets
                  NUXT_PUBLIC_SUPABASE_URL: ${{ secrets.NUXT_PUBLIC_SUPABASE_URL }}
                  NUXT_PUBLIC_SUPABASE_KEY: ${{ secrets.NUXT_PUBLIC_SUPABASE_KEY }}

            - name: Upload artifact
              uses: actions/upload-pages-artifact@v3
              with:
                  path: ./.output/public

    # Deployment job
    deploy:
        # Add a dependency to the build job
        needs: build

        # Grant GITHUB_TOKEN the permissions required to make a Pages deployment
        permissions:
            pages: write # to deploy to Pages
            id-token: write # to verify the deployment originates from an appropriate source

        # Deploy to the github_pages environment
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}

        # Specify runner + deployment step
        runs-on: ubuntu-latest
        steps:
            - name: Deploy to GitHub Pages
              id: deployment
              uses: actions/deploy-pages@v4
